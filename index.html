<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Lectro Bar</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB8dapvEnj-UfitrIeRwpRpcG3QLKwIQoI",
      authDomain: "lectrobar-app.firebaseapp.com",
      projectId: "lectrobar-app",
      storageBucket: "lectrobar-app.firebasestorage.app",
      messagingSenderId: "440745847831",
      appId: "1:440745847831:web:bd92b673d6b0eee4684052",
      measurementId: "G-4HYN30QBZN"
    };

    const app = initializeApp(firebaseConfig);
    const db  = getFirestore(app);

    // ── Seed initial data if collections are empty ──────────────
    const INIT_USERS = [
      { uid:"u1", name:"Ahmed Al-Rashid",  email:"ahmed@lectrobar.com",  role:"admin",            active:true,  factory:null },
      { uid:"u2", name:"Sara Mohamed",     email:"sara@lectrobar.com",   role:"manager",          active:true,  factory:null },
      { uid:"u3", name:"Khalid Hassan",    email:"khalid@lectrobar.com", role:"operator",         active:true,  factory:null },
      { uid:"u4", name:"Nadia Yousef",     email:"nadia@lectrobar.com",  role:"viewer",           active:false, factory:null },
      { uid:"u5", name:"Factory 1 User",   email:"f1@lectrobar.com",     role:"factory",          active:true,  factory:1    },
      { uid:"u6", name:"Factory 2 User",   email:"f2@lectrobar.com",     role:"factory",          active:true,  factory:2    },
      { uid:"u7", name:"Factory 3 User",   email:"f3@lectrobar.com",     role:"factory",          active:true,  factory:3    },
      { uid:"u8", name:"Technical Office", email:"to@lectrobar.com",     role:"technical_office", active:true,  factory:null },
    ];
    const INIT_JOBS = [
      { id:"LB-001", name:"Alpha Cable",  ampere:100, config:"3PH+FN+FE", series:"LSBA", qty:450, ip:10, date:"2024-01-15", exitDate:"2024-02-01", factory:3, status:"Finished"            },
      { id:"LB-002", name:"Beta Line",    ampere:63,  config:"3PH+HN",    series:"LSB2", qty:280, ip:6,  date:"2024-01-18", exitDate:"",           factory:1, status:"Under Manufacturing" },
      { id:"LB-003", name:"Gamma Wire",   ampere:25,  config:"3PH+HE",    series:"LSBA", qty:900, ip:22, date:"2024-02-01", exitDate:"",           factory:2, status:"Approved"            },
      { id:"LB-004", name:"Delta Bundle", ampere:150, config:"3PH+HN+HE", series:"LSB2", qty:120, ip:4,  date:"2024-02-10", exitDate:"",           factory:5, status:"Under Manufacturing" },
    ];

    async function seedIfEmpty() {
      const usersSnap = await getDocs(collection(db, "users"));
      if (usersSnap.empty) {
        for (const u of INIT_USERS) {
          await setDoc(doc(db, "users", u.uid), u);
        }
      }
      const jobsSnap = await getDocs(collection(db, "jobs"));
      if (jobsSnap.empty) {
        for (const j of INIT_JOBS) {
          await setDoc(doc(db, "jobs", j.id), j);
        }
      }
    }

    // Expose Firebase API to React app via window
    window.__FB = {
      db,
      collection, getDocs, addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot,
      seedIfEmpty
    };

    // Signal that Firebase is ready
    window.dispatchEvent(new Event("fb-ready"));
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0d0f14;--s1:#141720;--s2:#1c2130;--border:#252a38;
      --accent:#e63946;--text:#e8eaf0;--muted:#6b7280;--r:10px;
    }
    html,body,#root{height:100%;background:var(--bg);color:var(--text);
      font-family:'Tajawal',sans-serif;direction:rtl}

    .badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;
      border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;font-family:'JetBrains Mono',monospace}
    .av{border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-weight:700;flex-shrink:0;font-family:'JetBrains Mono',monospace}
    .fbanner{background:rgba(155,114,207,.1);border:1px solid rgba(155,114,207,.3);
      border-radius:8px;padding:9px 13px;margin-bottom:12px;font-size:11px;
      color:#9b72cf;font-family:'JetBrains Mono',monospace}
    .empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
    .lb-select{background:var(--s1);border:1px solid var(--border);border-radius:7px;
      padding:8px 10px;color:var(--text);font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;cursor:pointer}
    .lb-field{margin-bottom:12px}
    .lb-label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;letter-spacing:.5px;font-family:'JetBrains Mono',monospace}
    .lb-input{width:100%;background:var(--s2);border:1px solid var(--border);
      border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;
      font-family:'Tajawal',sans-serif;outline:none;transition:border-color .2s}
    .lb-input:focus{border-color:var(--accent)}
    .lb-input::placeholder{color:var(--muted)}
    .lb-input[type=number]{font-family:'JetBrains Mono',monospace}
    .lb-input:disabled{opacity:.45;cursor:not-allowed}
    .lb-search{flex:1;min-width:0;background:var(--s1);border:1px solid var(--border);
      border-radius:7px;padding:8px 12px;color:var(--text);font-size:11px;
      font-family:'JetBrains Mono',monospace;outline:none;transition:border-color .2s}
    .lb-search:focus{border-color:var(--accent)}
    .lb-search::placeholder{color:var(--muted)}
    .add-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;
      padding:8px 14px;font-size:11px;font-family:'JetBrains Mono',monospace;
      font-weight:700;cursor:pointer;white-space:nowrap;transition:opacity .2s}
    .add-btn:hover{opacity:.88}
    .act{background:none;border:1px solid var(--border);color:var(--muted);
      border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;
      font-family:'JetBrains Mono',monospace;transition:all .15s;text-align:center}
    .act:hover{border-color:var(--accent);color:var(--accent)}
    .act.del:hover{border-color:#e63946;color:#e63946}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .btn-ghost{background:var(--s2);color:var(--text);border:1px solid var(--border);
      border-radius:8px;padding:9px 18px;font-size:13px;font-family:'JetBrains Mono',monospace;cursor:pointer}
    .btn-save{background:var(--accent);color:#fff;border:none;border-radius:8px;
      padding:9px 22px;font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer;transition:opacity .2s}
    .btn-save:hover{opacity:.88}

    .tb{display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;height:52px;background:var(--s1);
      border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;flex-shrink:0}
    .tb-logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
      color:var(--accent);letter-spacing:3px}
    .tb-right{display:flex;align-items:center;gap:8px}
    .tb-menu{background:none;border:1px solid var(--border);color:var(--muted);
      border-radius:7px;width:34px;height:34px;cursor:pointer;font-size:15px;
      display:flex;align-items:center;justify-content:center;transition:all .15s}
    .tb-menu:hover{border-color:var(--accent);color:var(--accent)}
    .view-toggle{background:var(--s2);border:1px solid var(--border);color:var(--muted);
      border-radius:7px;padding:0 10px;height:34px;cursor:pointer;font-size:10px;
      display:flex;align-items:center;gap:5px;white-space:nowrap;
      font-family:'JetBrains Mono',monospace;transition:all .15s}
    .view-toggle:hover{border-color:var(--accent);color:var(--accent)}
    .view-toggle .vt-icon{font-size:14px}

    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.82);
      display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
    .modal-bg.desk{align-items:center}
    .modal{background:var(--s1);border:1px solid var(--border);
      border-radius:16px 16px 0 0;padding:20px 16px;
      width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
    .modal-bg.desk .modal{border-radius:16px;max-width:560px;max-height:88vh}
    .modal h3{font-size:14px;font-weight:700;margin-bottom:16px;font-family:'JetBrains Mono',monospace;color:var(--accent)}
    .modal-drag{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
    .modal-bg.desk .modal-drag{display:none}
    .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

    .conf-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);
      display:flex;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(4px)}
    .conf{background:var(--s1);border:1px solid rgba(230,57,70,.3);
      border-radius:14px;padding:26px 24px;width:300px;max-width:90vw;text-align:center}
    .conf-icon{font-size:32px;margin-bottom:10px}
    .conf-msg{font-size:13px;margin-bottom:20px;line-height:1.6;color:var(--text);font-family:'Tajawal',sans-serif}
    .conf-btns{display:flex;gap:10px;justify-content:center}
    .conf-del{background:var(--accent);color:#fff;border:none;border-radius:8px;
      padding:9px 22px;font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:700;cursor:pointer}
    .conf-cancel{background:var(--s2);color:var(--muted);border:1px solid var(--border);
      border-radius:8px;padding:9px 22px;font-size:12px;font-family:'JetBrains Mono',monospace;cursor:pointer}

    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
      padding:9px 20px;border-radius:9px;font-size:12px;font-weight:700;
      z-index:999;white-space:nowrap;pointer-events:none;
      font-family:'JetBrains Mono',monospace;animation:toastUp .2s ease}
    @keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(10px)}
      to{opacity:1;transform:translateX(-50%) translateY(0)}}
    .toast.success{background:#2a9d8f;color:#fff}
    .toast.error{background:#e63946;color:#fff}
    .toast.info{background:#457b9d;color:#fff}

    /* Loading spinner */
    .loading-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);
      border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loading-lbl{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);letter-spacing:2px}

    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 30% 20%,#1f0608 0%,#0d0f14 60%);padding:16px}
    .login-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;
      padding:32px 24px;width:100%;max-width:400px;
      box-shadow:0 0 60px rgba(230,57,70,.07),0 16px 48px rgba(0,0,0,.5)}
    .login-logo{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;
      color:var(--accent);letter-spacing:4px;text-align:center;margin-bottom:4px}
    .login-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:28px}
    .login-btn{width:100%;background:var(--accent);color:#fff;border:none;
      border-radius:9px;padding:13px;font-size:15px;font-family:'Tajawal',sans-serif;
      font-weight:700;cursor:pointer;margin-top:6px;transition:opacity .2s}
    .login-btn:hover{opacity:.88}
    .login-err{background:rgba(230,57,70,.1);border:1px solid rgba(230,57,70,.3);
      color:#ff7b7b;border-radius:8px;padding:10px 13px;font-size:12px;margin-bottom:13px}
    .hint-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
    .hint-btn{background:var(--s2);border:1px solid var(--border);border-radius:7px;
      padding:7px 6px;color:var(--muted);font-size:10px;cursor:pointer;
      font-family:'JetBrains Mono',monospace;transition:all .15s;text-align:center}
    .hint-btn:hover,.hint-btn.sel{border-color:var(--accent);color:var(--accent);background:rgba(230,57,70,.08)}
    .hints-sep{margin-top:20px;border-top:1px solid var(--border);padding-top:16px}
    .hints-lbl{font-size:10px;color:var(--muted);text-align:center;margin-bottom:10px;letter-spacing:.5px}

    /* ── MOBILE ── */
    .mob-wrap{display:flex;flex-direction:column;height:100vh}
    .mob-main{padding:14px;overflow-y:auto;flex:1}
    .mob-pg-title{font-size:16px;font-weight:700;color:var(--accent);
      font-family:'JetBrains Mono',monospace;letter-spacing:1px;
      display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .mob-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
    .stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px 10px}
    .stat-lbl{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:5px}
    .stat-val{font-size:22px;font-weight:900;font-family:'JetBrains Mono',monospace}
    .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
    .jcard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px}
    .jcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .jcard-name{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--text);flex:1;margin-left:8px}
    .jcard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
    .jcard-item{background:var(--s2);border-radius:6px;padding:7px 8px}
    .jcard-item-lbl{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.4px;margin-bottom:3px}
    .jcard-item-val{font-size:12px;font-family:'JetBrains Mono',monospace;color:var(--text)}
    .jcard-acts{display:flex;gap:8px}
    .ucard{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
    .ucard-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
    .ucard-info{flex:1}
    .ucard-name{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .ucard-email{font-size:10px;color:var(--muted);margin-top:2px;font-family:'JetBrains Mono',monospace}
    .ucard-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .u-inactive{opacity:.4}
    .dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:80;
      display:flex;justify-content:flex-end;backdrop-filter:blur(3px)}
    .dr{width:240px;height:100%;background:var(--s1);
      border-left:1px solid var(--border);display:flex;flex-direction:column;
      animation:slideIn .2s ease}
    @keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
    .dr-head{display:flex;align-items:center;justify-content:space-between;
      padding:16px;border-bottom:1px solid var(--border)}
    .dr-logo{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;
      color:var(--accent);letter-spacing:2px}
    .dr-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:4px}
    .dr-user{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .dr-uname{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .dr-urole{font-size:10px;color:var(--muted);margin-top:2px}
    .dr-nav{flex:1;padding:10px 8px}
    .dr-item{display:flex;align-items:center;gap:10px;padding:11px 12px;
      border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);
      transition:all .15s;margin-bottom:2px;font-family:'JetBrains Mono',monospace;
      background:none;border:none;width:100%;text-align:right}
    .dr-item.on,.dr-item:hover{background:rgba(230,57,70,.08);color:var(--accent)}
    .dr-foot{padding:14px 16px;border-top:1px solid var(--border)}
    .dr-logout{width:100%;background:none;border:1px solid var(--border);color:var(--muted);
      border-radius:8px;padding:10px;font-size:12px;font-family:'JetBrains Mono',monospace;
      cursor:pointer;transition:all .15s}
    .dr-logout:hover{border-color:#e63946;color:#e63946}

    /* ── DESKTOP ── */
    .desk-wrap{display:flex;flex-direction:column;height:100vh}
    .desk-body{display:flex;flex:1;overflow:hidden}
    .desk-main{flex:1;overflow-y:auto;padding:20px 24px}
    .desk-pg-title{font-size:18px;font-weight:700;color:var(--accent);
      font-family:'JetBrains Mono',monospace;letter-spacing:1px;
      display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    .desk-stats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:18px}
    .desk-stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:14px 12px}
    .desk-stat-lbl{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.5px;margin-bottom:6px}
    .desk-stat-val{font-size:26px;font-weight:900;font-family:'JetBrains Mono',monospace}
    .desk-toolbar{display:flex;gap:10px;margin-bottom:14px;align-items:center}
    .tbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .tbl{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace}
    .tbl th{padding:11px 14px;text-align:right;font-size:10px;color:var(--muted);
      letter-spacing:.6px;font-weight:700;border-bottom:1px solid var(--border);
      background:var(--s2);white-space:nowrap}
    .tbl td{padding:12px 14px;font-size:12px;border-bottom:1px solid var(--border);
      color:var(--text);vertical-align:middle}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr:hover{background:rgba(255,255,255,.025)}
    .tbl-id{color:var(--muted);font-size:10px}
    .tbl-name{font-weight:700;color:var(--text)}
    .tbl-acts{display:flex;gap:6px}
    .tbl-act{background:none;border:1px solid var(--border);color:var(--muted);
      border-radius:6px;padding:5px 12px;font-size:10px;cursor:pointer;
      font-family:'JetBrains Mono',monospace;transition:all .15s;white-space:nowrap}
    .tbl-act:hover{border-color:var(--accent);color:var(--accent)}
    .tbl-act.del:hover{border-color:#e63946;color:#e63946}
    .sidebar{width:220px;background:var(--s1);border-right:1px solid var(--border);
      display:flex;flex-direction:column;flex-shrink:0}
    .sb-brand{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
    .sb-logo{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;
      color:var(--accent);letter-spacing:3px;display:block}
    .sb-sub{font-size:9px;color:var(--muted);letter-spacing:1px;font-family:'JetBrains Mono',monospace;margin-top:3px;display:block}
    .sb-user{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .sb-uname{font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace}
    .sb-urole{font-size:10px;color:var(--muted);margin-top:2px}
    .sb-nav{flex:1;padding:10px 8px}
    .sb-item{display:flex;align-items:center;gap:10px;padding:11px 12px;
      border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);
      transition:all .15s;margin-bottom:2px;font-family:'JetBrains Mono',monospace;
      background:none;border:none;width:100%;text-align:right}
    .sb-item.on,.sb-item:hover{background:rgba(230,57,70,.08);color:var(--accent)}
    .sb-foot{padding:14px 16px;border-top:1px solid var(--border)}
    .sb-logout{width:100%;background:none;border:1px solid var(--border);color:var(--muted);
      border-radius:8px;padding:10px;font-size:12px;font-family:'JetBrains Mono',monospace;
      cursor:pointer;transition:all .15s}
    .sb-logout:hover{border-color:#e63946;color:#e63946}
    .utbl-wrap{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .utbl{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace}
    .utbl th{padding:11px 14px;text-align:right;font-size:10px;color:var(--muted);
      letter-spacing:.6px;font-weight:700;border-bottom:1px solid var(--border);
      background:var(--s2);white-space:nowrap}
    .utbl td{padding:12px 14px;font-size:12px;border-bottom:1px solid var(--border);
      color:var(--text);vertical-align:middle}
    .utbl tbody tr:last-child td{border-bottom:none}
    .utbl tbody tr:hover{background:rgba(255,255,255,.025)}
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useCallback, useEffect, useRef } = React;

    /* ─── STATIC CONFIG ─────────────────────────────────────── */
    const ROLES = {
      admin:            { label:"Admin",       color:"#e63946" },
      manager:          { label:"Manager",     color:"#f4a261" },
      operator:         { label:"Operator",    color:"#2a9d8f" },
      viewer:           { label:"Viewer",      color:"#457b9d" },
      factory:          { label:"Factory",     color:"#9b72cf" },
      technical_office: { label:"Tech.Office", color:"#e9c46a" },
    };
    const PERMISSIONS = {
      admin:            { canAddJob:true,  canEditJob:true,  canDeleteJob:true,  canManageUsers:true,  factoryOnly:false, canDeleteUser:true,  canEditUserRole:true  },
      manager:          { canAddJob:true,  canEditJob:true,  canDeleteJob:false, canManageUsers:false, factoryOnly:false, canDeleteUser:false, canEditUserRole:false },
      operator:         { canAddJob:true,  canEditJob:false, canDeleteJob:false, canManageUsers:false, factoryOnly:false, canDeleteUser:false, canEditUserRole:false },
      viewer:           { canAddJob:false, canEditJob:false, canDeleteJob:false, canManageUsers:false, factoryOnly:false, canDeleteUser:false, canEditUserRole:false },
      factory:          { canAddJob:false, canEditJob:true,  canDeleteJob:false, canManageUsers:false, factoryOnly:true,  canDeleteUser:false, canEditUserRole:false },
      technical_office: { canAddJob:true,  canEditJob:true,  canDeleteJob:false, canManageUsers:true,  factoryOnly:false, canDeleteUser:true,  canEditUserRole:true  },
    };
    const STATUS_META = {
      "Approved":            { color:"#f4a261", bg:"rgba(244,162,97,0.13)",  icon:"✦", label:"Approved" },
      "Under Manufacturing": { color:"#2a9d8f", bg:"rgba(42,157,143,0.13)", icon:"⚙", label:"U.M"      },
      "Finished":            { color:"#5a9fd4", bg:"rgba(90,159,212,0.13)", icon:"✔", label:"Finished"  },
      "Exit":                { color:"#9b72cf", bg:"rgba(155,114,207,0.13)", icon:"✕", label:"Exit"     },
    };
    const CONFIG_OPTIONS = ["3PH+FN+FE","3PH+HN","3PH+HE","3PH+HN+HE"];
    const SERIES_OPTIONS = ["LSBA","LSB1","LSB2","LSB3","LSB.PRO"];
    const LOGIN_HINT = [
      { label:"Admin",     email:"ahmed@lectrobar.com"  },
      { label:"Manager",   email:"sara@lectrobar.com"   },
      { label:"Operator",  email:"khalid@lectrobar.com" },
      { label:"Viewer",    email:"nadia@lectrobar.com"  },
      { label:"Factory 1", email:"f1@lectrobar.com"     },
      { label:"Factory 2", email:"f2@lectrobar.com"     },
      { label:"Factory 3", email:"f3@lectrobar.com"     },
      { label:"Tech.Off",  email:"to@lectrobar.com"     },
    ];
    const USER_PASSWORDS = {
      "ahmed@lectrobar.com":  "admin123",
      "sara@lectrobar.com":   "manager123",
      "khalid@lectrobar.com": "op123",
      "nadia@lectrobar.com":  "view123",
      "f1@lectrobar.com":     "f1pass",
      "f2@lectrobar.com":     "f2pass",
      "f3@lectrobar.com":     "f3pass",
      "to@lectrobar.com":     "to123",
    };

    /* ─── FIREBASE HELPERS ──────────────────────────────────── */
    function getDB() { return window.__FB; }

    async function fbGetJobs() {
      const { db, collection, getDocs } = getDB();
      const snap = await getDocs(collection(db, "jobs"));
      return snap.docs.map(d => ({ ...d.data(), _docId: d.id }));
    }
    async function fbGetUsers() {
      const { db, collection, getDocs } = getDB();
      const snap = await getDocs(collection(db, "users"));
      return snap.docs.map(d => ({ ...d.data(), _docId: d.id }));
    }
    async function fbSaveJob(data) {
      const { db, doc, setDoc, collection, addDoc } = getDB();
      if (data.id) {
        await setDoc(doc(db, "jobs", data.id), data);
        return data;
      } else {
        const newId = "LB-" + String(Date.now()).slice(-6);
        const newData = { ...data, id: newId };
        await setDoc(doc(db, "jobs", newId), newData);
        return newData;
      }
    }
    async function fbDeleteJob(id) {
      const { db, doc, deleteDoc } = getDB();
      await deleteDoc(doc(db, "jobs", id));
    }
    async function fbSaveUser(data) {
      const { db, doc, setDoc } = getDB();
      const uid = data.uid || "u" + Date.now();
      const newData = { ...data, uid };
      await setDoc(doc(db, "users", uid), newData);
      return newData;
    }
    async function fbUpdateUser(uid, changes) {
      const { db, doc, updateDoc } = getDB();
      await updateDoc(doc(db, "users", uid), changes);
    }
    async function fbDeleteUser(uid) {
      const { db, doc, deleteDoc } = getDB();
      await deleteDoc(doc(db, "users", uid));
    }

    /* ─── HOOKS ──────────────────────────────────────────────── */
    function useToast() {
      const [t, setT] = useState(null);
      const show = useCallback((msg, type = "success") => {
        setT({ msg, type });
        setTimeout(() => setT(null), 2500);
      }, []);
      return [t, show];
    }

    /* ─── SHARED COMPONENTS ──────────────────────────────────── */
    function Av({ name = "", color = "#e63946", size = 36 }) {
      const ini = name.split(" ").slice(0,2).map(w => w[0]||"").join("").toUpperCase();
      return (
        <div className="av" style={{width:size,height:size,fontSize:size*0.34,background:color+"22",color}}>
          {ini}
        </div>
      );
    }
    function SBadge({ status }) {
      const s = STATUS_META[status] || { color:"#888", bg:"#1c2130", icon:"•", label:status };
      return <span className="badge" style={{background:s.bg,color:s.color}}>{s.icon} {s.label}</span>;
    }
    function Confirm({ msg, onOk, onCancel }) {
      return (
        <div className="conf-bg">
          <div className="conf">
            <div className="conf-icon">🗑</div>
            <div className="conf-msg">{msg}</div>
            <div className="conf-btns">
              <button className="conf-cancel" onClick={onCancel}>إلغاء</button>
              <button className="conf-del" onClick={onOk}>حذف</button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── JOB MODAL ──────────────────────────────────────────── */
    function JobModal({ job, onSave, onClose, user, isDesktop }) {
      const empty = { name:"", config:"3PH+FN+FE", qty:"", factory:"", ampere:"", series:"LSBA", date:"", exitDate:"", status:"Approved", ip:"" };
      const [f, setF] = useState(job ? {...empty,...job} : empty);
      const [saving, setSaving] = useState(false);
      const set = (k,v) => setF(p => ({...p,[k]:v}));
      const isFactory = user.role === "factory";
      const save = async () => {
        if (!f.name.trim() || saving) return;
        setSaving(true);
        await onSave(f);
        setSaving(false);
      };
      return (
        <div className={`modal-bg ${isDesktop?"desk":""}`} onClick={e => e.target===e.currentTarget && onClose()}>
          <div className="modal">
            <div className="modal-drag" />
            <h3>{job?.id ? "✎ EDIT JOB" : "+ NEW JOB"}</h3>
            {isFactory && <div className="fbanner">🏭 Factory mode — تعديل الحالة فقط</div>}
            <div className="lb-field">
              <label className="lb-label">Name</label>
              <input className="lb-input" placeholder="Alpha Cable" disabled={isFactory}
                value={f.name} onChange={e => set("name",e.target.value)} />
            </div>
            <div className="g2">
              <div className="lb-field">
                <label className="lb-label">Config</label>
                <select className="lb-select" style={{width:"100%"}} disabled={isFactory}
                  value={f.config} onChange={e => set("config",e.target.value)}>
                  {CONFIG_OPTIONS.map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="lb-field">
                <label className="lb-label">QTY (cm)</label>
                <input className="lb-input" type="number" placeholder="450" disabled={isFactory}
                  value={f.qty} onChange={e => set("qty",e.target.value)} />
              </div>
            </div>
            <div className="g3">
              <div className="lb-field">
                <label className="lb-label">Factory</label>
                <input className="lb-input" type="number" placeholder="1" disabled={isFactory}
                  value={f.factory} onChange={e => set("factory",e.target.value)} />
              </div>
              <div className="lb-field">
                <label className="lb-label">Amper</label>
                <input className="lb-input" type="number" placeholder="100" disabled={isFactory}
                  value={f.ampere} onChange={e => set("ampere",e.target.value)} />
              </div>
              <div className="lb-field">
                <label className="lb-label">IP</label>
                <input className="lb-input" type="number" placeholder="10" disabled={isFactory}
                  value={f.ip} onChange={e => set("ip",e.target.value)} />
              </div>
            </div>
            <div className="g2">
              <div className="lb-field">
                <label className="lb-label">Series</label>
                <select className="lb-select" style={{width:"100%"}} disabled={isFactory}
                  value={f.series} onChange={e => set("series",e.target.value)}>
                  {SERIES_OPTIONS.map(o => <option key={o}>{o}</option>)}
                </select>
              </div>
              <div className="lb-field">
                <label className="lb-label">Status</label>
                <select className="lb-select" style={{width:"100%"}}
                  value={f.status} onChange={e => set("status",e.target.value)}>
                  <option value="Approved">Approved</option>
                  <option value="Under Manufacturing">Under Manufacturing</option>
                  <option value="Finished">Finished</option>
                  <option value="Exit">Exit</option>
                </select>
              </div>
            </div>
            <div className="g2">
              <div className="lb-field">
                <label className="lb-label">Date</label>
                <input className="lb-input" type="date" disabled={isFactory}
                  value={f.date} onChange={e => set("date",e.target.value)} />
              </div>
              <div className="lb-field">
                <label className="lb-label">Exit Date</label>
                <input className="lb-input" type="date" disabled={isFactory}
                  value={f.exitDate} onChange={e => set("exitDate",e.target.value)} />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn-ghost" onClick={onClose}>Cancel</button>
              <button className="btn-save" onClick={save} disabled={saving}>
                {saving ? "Saving..." : "Save"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── USER MODAL ─────────────────────────────────────────── */
    function UserModal({ onSave, onClose, isDesktop }) {
      const [f, setF] = useState({ name:"", email:"", role:"operator", active:true, factory:null });
      const [saving, setSaving] = useState(false);
      const set = (k,v) => setF(p => ({...p,[k]:v}));
      const save = async () => {
        if (!f.name || !f.email || saving) return;
        setSaving(true);
        await onSave(f);
        setSaving(false);
      };
      return (
        <div className={`modal-bg ${isDesktop?"desk":""}`} onClick={e => e.target===e.currentTarget && onClose()}>
          <div className="modal" style={{maxWidth:420}}>
            <div className="modal-drag" />
            <h3>+ NEW USER</h3>
            <div className="lb-field">
              <label className="lb-label">Full Name *</label>
              <input className="lb-input" placeholder="Ahmed Al-Rashid" value={f.name} onChange={e => set("name",e.target.value)} />
            </div>
            <div className="lb-field">
              <label className="lb-label">Email *</label>
              <input className="lb-input" type="email" placeholder="user@lectrobar.com" value={f.email} onChange={e => set("email",e.target.value)} />
            </div>
            <div className="g2">
              <div className="lb-field">
                <label className="lb-label">Role</label>
                <select className="lb-select" style={{width:"100%"}} value={f.role}
                  onChange={e => { set("role",e.target.value); if(e.target.value!=="factory") set("factory",null); }}>
                  {Object.entries(ROLES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                </select>
              </div>
              <div className="lb-field">
                <label className="lb-label">Status</label>
                <select className="lb-select" style={{width:"100%"}} value={String(f.active)} onChange={e => set("active",e.target.value==="true")}>
                  <option value="true">Active</option>
                  <option value="false">Inactive</option>
                </select>
              </div>
            </div>
            {f.role==="factory" && (
              <div className="lb-field">
                <label className="lb-label">Factory #</label>
                <input className="lb-input" type="number" placeholder="1" value={f.factory||""} onChange={e => set("factory",Number(e.target.value))} />
              </div>
            )}
            <div className="modal-foot">
              <button className="btn-ghost" onClick={onClose}>Cancel</button>
              <button className="btn-save" onClick={save} disabled={saving}>{saving?"Saving...":"Create"}</button>
            </div>
          </div>
        </div>
      );
    }

    function ViewToggleBtn({ isDesktop, onToggle }) {
      return (
        <button className="view-toggle" onClick={onToggle}>
          <span className="vt-icon">{isDesktop ? "📱" : "🖥"}</span>
          <span>{isDesktop ? "Mobile" : "Desktop"}</span>
        </button>
      );
    }

    /* ══ MOBILE ══════════════════════════════════════════════════ */
    function MobileDrawer({ open, onClose, page, setPage, user, onLogout }) {
      const perms = PERMISSIONS[user.role] || {};
      const rc = ROLES[user.role]?.color || "#888";
      const items = [
        { id:"jobs",  icon:"⚡", label:"Follow-up", show:true },
        { id:"users", icon:"👥", label:"Users",     show:perms.canManageUsers },
      ];
      const go = (id) => { setPage(id); onClose(); };
      if (!open) return null;
      return (
        <div className="dr-bg" onClick={onClose}>
          <div className="dr" onClick={e => e.stopPropagation()}>
            <div className="dr-head">
              <span className="dr-logo">LECTRO BAR</span>
              <button className="dr-close" onClick={onClose}>✕</button>
            </div>
            <div className="dr-user">
              <Av name={user.name} color={rc} size={40} />
              <div>
                <div className="dr-uname">{user.name.split(" ")[0]}</div>
                <div className="dr-urole">{ROLES[user.role]?.label||user.role}{user.factory?` · F${user.factory}`:""}</div>
              </div>
            </div>
            <nav className="dr-nav">
              {items.filter(i => i.show).map(item => (
                <button key={item.id} className={`dr-item ${page===item.id?"on":""}`} onClick={() => go(item.id)}>
                  <span style={{fontSize:16,marginLeft:8}}>{item.icon}</span>{item.label}
                </button>
              ))}
            </nav>
            <div className="dr-foot">
              <button className="dr-logout" onClick={onLogout}>⏻ Logout</button>
            </div>
          </div>
        </div>
      );
    }

    function MobileJobsPage({ user, toast, jobs, setJobs }) {
      const perms = PERMISSIONS[user.role] || {};
      const [filter, setFilter] = useState("All");
      const [search, setSearch] = useState("");
      const [modal, setModal]   = useState(null);
      const [confirm, setConfirm] = useState(null);

      const visible = perms.factoryOnly
        ? jobs.filter(j => Number(j.factory)===Number(user.factory))
        : jobs;

      const counts = { Approved:0, "Under Manufacturing":0, Finished:0, Exit:0 };
      visible.forEach(j => { if (counts[j.status]!==undefined) counts[j.status]++; });
      const totalQty = visible.reduce((s,j) => s+(Number(j.qty)||0), 0);

      const filtered = visible
        .filter(j => filter==="All" || j.status===filter)
        .filter(j => {
          if (!search.trim()) return true;
          const q = search.toLowerCase();
          return j.name?.toLowerCase().includes(q) || j.config?.toLowerCase().includes(q) ||
            j.series?.toLowerCase().includes(q) || String(j.factory).includes(q);
        });

      const saveJob = async (data) => {
        try {
          const saved = await fbSaveJob(data);
          setJobs(prev => saved.id && prev.find(j => j.id===saved.id)
            ? prev.map(j => j.id===saved.id ? saved : j)
            : [saved, ...prev]);
          setModal(null);
          toast(modal?.id ? "Job updated ✔" : "Job added ✔");
        } catch(e) { toast("Error saving job","error"); }
      };
      const doDelete = async () => {
        try {
          await fbDeleteJob(confirm.id);
          setJobs(prev => prev.filter(j => j.id!==confirm.id));
          setConfirm(null);
          toast("Deleted","info");
        } catch(e) { toast("Error deleting","error"); }
      };

      return (
        <div>
          <div className="mob-pg-title">
            <span>⚡ FOLLOW-UP</span>
            {perms.canAddJob && <button className="add-btn" onClick={() => setModal({})}>+ New Job</button>}
          </div>
          {perms.factoryOnly && <div className="fbanner">🏭 Factory {user.factory}</div>}
          <div className="mob-stats">
            <div className="stat"><div className="stat-lbl">TOTAL</div><div className="stat-val" style={{color:"var(--accent)"}}>{visible.length}</div></div>
            <div className="stat"><div className="stat-lbl">✦ APPR</div><div className="stat-val" style={{color:"#f4a261"}}>{counts.Approved}</div></div>
            <div className="stat"><div className="stat-lbl">⚙ U.M</div><div className="stat-val" style={{color:"#2a9d8f"}}>{counts["Under Manufacturing"]}</div></div>
            <div className="stat"><div className="stat-lbl">✔ DONE</div><div className="stat-val" style={{color:"#5a9fd4"}}>{counts.Finished}</div></div>
            <div className="stat"><div className="stat-lbl">✕ EXIT</div><div className="stat-val" style={{color:"#9b72cf"}}>{counts.Exit}</div></div>
            <div className="stat"><div className="stat-lbl">QTY cm</div><div className="stat-val" style={{color:"var(--text)",fontSize:14}}>{totalQty.toLocaleString()}</div></div>
          </div>
          <div className="toolbar">
            <select className="lb-select" value={filter} onChange={e => setFilter(e.target.value)}>
              <option value="All">All</option>
              <option value="Approved">Approved</option>
              <option value="Under Manufacturing">U.M</option>
              <option value="Finished">Finished</option>
              <option value="Exit">Exit</option>
            </select>
            <input className="lb-search" placeholder="🔍 Search..." value={search} onChange={e => setSearch(e.target.value)} />
            <span style={{color:"var(--muted)",fontSize:11,fontFamily:"'JetBrains Mono',monospace",alignSelf:"center"}}>{filtered.length}</span>
          </div>
          {filtered.length===0 && <div className="empty">No jobs found</div>}
          {filtered.map(job => (
            <div key={job.id} className="jcard">
              <div className="jcard-top">
                <SBadge status={job.status} />
                <span className="jcard-name">{job.name}</span>
              </div>
              <div className="jcard-grid">
                <div className="jcard-item"><div className="jcard-item-lbl">CONFIG</div><div className="jcard-item-val" style={{fontSize:10}}>{job.config||"—"}</div></div>
                <div className="jcard-item"><div className="jcard-item-lbl">QTY</div><div className="jcard-item-val">{job.qty||"—"}</div></div>
                <div className="jcard-item"><div className="jcard-item-lbl">FACT.</div><div className="jcard-item-val">{job.factory||"—"}</div></div>
                <div className="jcard-item"><div className="jcard-item-lbl">AMPER</div><div className="jcard-item-val">{job.ampere||"—"}</div></div>
                <div className="jcard-item"><div className="jcard-item-lbl">SERIES</div><div className="jcard-item-val">{job.series||"—"}</div></div>
                <div className="jcard-item"><div className="jcard-item-lbl">DATE</div><div className="jcard-item-val" style={{fontSize:10}}>{job.date||"—"}</div></div>
              </div>
              {(perms.canEditJob||perms.canDeleteJob) && (
                <div className="jcard-acts">
                  {perms.canEditJob && <button className="act" onClick={() => setModal(job)}>✎ Edit</button>}
                  {perms.canDeleteJob && <button className="act del" onClick={() => setConfirm({id:job.id})}>🗑 Del</button>}
                </div>
              )}
            </div>
          ))}
          {modal!==null && <JobModal job={modal?.id?modal:null} onSave={saveJob} onClose={() => setModal(null)} user={user} isDesktop={false} />}
          {confirm && <Confirm msg="هل أنت متأكد من حذف هذا الجوب؟" onOk={doDelete} onCancel={() => setConfirm(null)} />}
        </div>
      );
    }

    function MobileUsersPage({ currentUser, toast, users, setUsers }) {
      const perms = PERMISSIONS[currentUser.role] || {};
      const [modal, setModal]   = useState(false);
      const [confirm, setConfirm] = useState(null);

      const addUser = async (f) => {
        try {
          const saved = await fbSaveUser(f);
          setUsers(p => [...p, saved]);
          setModal(false);
          toast("User created ✔");
        } catch(e) { toast("Error","error"); }
      };
      const toggle = async (uid) => {
        const u = users.find(x => x.uid===uid);
        try {
          await fbUpdateUser(uid, { active: !u.active });
          setUsers(p => p.map(x => x.uid===uid ? {...x,active:!x.active} : x));
          toast("Updated","info");
        } catch(e) { toast("Error","error"); }
      };
      const chRole = async (uid, role) => {
        try {
          await fbUpdateUser(uid, { role });
          setUsers(p => p.map(x => x.uid===uid ? {...x,role} : x));
          toast("Role changed","info");
        } catch(e) { toast("Error","error"); }
      };
      const doDelete = async () => {
        try {
          await fbDeleteUser(confirm.uid);
          setUsers(p => p.filter(x => x.uid!==confirm.uid));
          setConfirm(null);
          toast("Deleted","info");
        } catch(e) { toast("Error","error"); }
      };

      return (
        <div>
          <div className="mob-pg-title">
            <span>👥 USERS</span>
            {perms.canManageUsers && <button className="add-btn" onClick={() => setModal(true)}>+ New User</button>}
          </div>
          {users.map(u => (
            <div key={u.uid} className={`ucard ${!u.active?"u-inactive":""}`}>
              <div className="ucard-top">
                <Av name={u.name} color={ROLES[u.role]?.color||"#888"} size={42} />
                <div className="ucard-info">
                  <div className="ucard-name">{u.name}</div>
                  <div className="ucard-email">
                    {u.email}
                    {u.role==="factory"&&u.factory&&<span style={{color:"#9b72cf",marginRight:6}}> · F{u.factory}</span>}
                  </div>
                </div>
              </div>
              <div className="ucard-meta">
                {perms.canEditUserRole ? (
                  <select className="lb-select" style={{padding:"4px 8px",fontSize:11}}
                    value={u.role} onChange={e => chRole(u.uid,e.target.value)}>
                    {Object.entries(ROLES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                  </select>
                ) : (
                  <span className="badge" style={{background:(ROLES[u.role]?.color||"#888")+"22",color:ROLES[u.role]?.color||"#888"}}>
                    {ROLES[u.role]?.label||u.role}
                  </span>
                )}
                {perms.canManageUsers && (
                  <button className="act" style={u.active?{borderColor:"#2a9d8f",color:"#2a9d8f"}:{}} onClick={() => toggle(u.uid)}>
                    {u.active?"✔ Active":"✕ Off"}
                  </button>
                )}
                {perms.canDeleteUser && u.uid!==currentUser.uid && (
                  <button className="act del" onClick={() => setConfirm({uid:u.uid,name:u.name})}>🗑</button>
                )}
              </div>
            </div>
          ))}
          {modal && <UserModal onSave={addUser} onClose={() => setModal(false)} isDesktop={false} />}
          {confirm && <Confirm msg={`حذف "${confirm.name}"؟`} onOk={doDelete} onCancel={() => setConfirm(null)} />}
        </div>
      );
    }

    function MobileLayout({ user, onLogout, onToggleView, jobs, setJobs, users, setUsers, toast }) {
      const [page, setPage]     = useState("jobs");
      const [drawer, setDrawer] = useState(false);
      const rc = ROLES[user.role]?.color || "#888";
      return (
        <div className="mob-wrap">
          <div className="tb">
            <span className="tb-logo">LECTRO BAR</span>
            <div className="tb-right">
              <ViewToggleBtn isDesktop={false} onToggle={onToggleView} />
              <Av name={user.name} color={rc} size={30} />
              <button className="tb-menu" onClick={() => setDrawer(true)}>☰</button>
            </div>
          </div>
          <div className="mob-main">
            {page==="jobs"  && <MobileJobsPage  user={user} toast={toast} jobs={jobs} setJobs={setJobs} />}
            {page==="users" && <MobileUsersPage currentUser={user} toast={toast} users={users} setUsers={setUsers} />}
          </div>
          <MobileDrawer open={drawer} onClose={() => setDrawer(false)} page={page} setPage={setPage} user={user} onLogout={onLogout} />
        </div>
      );
    }

    /* ══ DESKTOP ═════════════════════════════════════════════════ */
    function DesktopSidebar({ user, page, setPage, onLogout }) {
      const perms = PERMISSIONS[user.role] || {};
      const rc = ROLES[user.role]?.color || "#888";
      const items = [
        { id:"jobs",  icon:"⚡", label:"Follow-up", show:true },
        { id:"users", icon:"👥", label:"Users",     show:perms.canManageUsers },
      ];
      return (
        <div className="sidebar">
          <div className="sb-brand">
            <span className="sb-logo">LECTRO BAR</span>
            <span className="sb-sub">PRODUCTION MGMT</span>
          </div>
          <div className="sb-user">
            <Av name={user.name} color={rc} size={38} />
            <div>
              <div className="sb-uname">{user.name.split(" ")[0]}</div>
              <div className="sb-urole">{ROLES[user.role]?.label||user.role}{user.factory?` · F${user.factory}`:""}</div>
            </div>
          </div>
          <nav className="sb-nav">
            {items.filter(i => i.show).map(item => (
              <button key={item.id} className={`sb-item ${page===item.id?"on":""}`} onClick={() => setPage(item.id)}>
                <span style={{fontSize:15,marginLeft:8}}>{item.icon}</span>{item.label}
              </button>
            ))}
          </nav>
          <div className="sb-foot">
            <button className="sb-logout" onClick={onLogout}>⏻ Logout</button>
          </div>
        </div>
      );
    }

    function DesktopJobsPage({ user, toast, jobs, setJobs }) {
      const perms = PERMISSIONS[user.role] || {};
      const [filter, setFilter] = useState("All");
      const [search, setSearch] = useState("");
      const [modal, setModal]   = useState(null);
      const [confirm, setConfirm] = useState(null);

      const visible = perms.factoryOnly
        ? jobs.filter(j => Number(j.factory)===Number(user.factory))
        : jobs;

      const counts = { Approved:0, "Under Manufacturing":0, Finished:0, Exit:0 };
      visible.forEach(j => { if (counts[j.status]!==undefined) counts[j.status]++; });
      const totalQty = visible.reduce((s,j) => s+(Number(j.qty)||0), 0);

      const filtered = visible
        .filter(j => filter==="All" || j.status===filter)
        .filter(j => {
          if (!search.trim()) return true;
          const q = search.toLowerCase();
          return j.name?.toLowerCase().includes(q) || j.config?.toLowerCase().includes(q) ||
            j.series?.toLowerCase().includes(q) || String(j.factory).includes(q);
        });

      const saveJob = async (data) => {
        try {
          const saved = await fbSaveJob(data);
          setJobs(prev => saved.id && prev.find(j => j.id===saved.id)
            ? prev.map(j => j.id===saved.id ? saved : j)
            : [saved, ...prev]);
          setModal(null);
          toast(modal?.id ? "Job updated ✔" : "Job added ✔");
        } catch(e) { toast("Error saving job","error"); }
      };
      const doDelete = async () => {
        try {
          await fbDeleteJob(confirm.id);
          setJobs(prev => prev.filter(j => j.id!==confirm.id));
          setConfirm(null);
          toast("Deleted","info");
        } catch(e) { toast("Error deleting","error"); }
      };

      return (
        <div>
          <div className="desk-pg-title">
            <span>⚡ FOLLOW-UP</span>
            {perms.canAddJob && <button className="add-btn" onClick={() => setModal({})}>+ New Job</button>}
          </div>
          {perms.factoryOnly && <div className="fbanner">🏭 Factory {user.factory}</div>}
          <div className="desk-stats">
            <div className="desk-stat"><div className="desk-stat-lbl">TOTAL</div><div className="desk-stat-val" style={{color:"var(--accent)"}}>{visible.length}</div></div>
            <div className="desk-stat"><div className="desk-stat-lbl">✦ APPROVED</div><div className="desk-stat-val" style={{color:"#f4a261"}}>{counts.Approved}</div></div>
            <div className="desk-stat"><div className="desk-stat-lbl">⚙ MANUF.</div><div className="desk-stat-val" style={{color:"#2a9d8f"}}>{counts["Under Manufacturing"]}</div></div>
            <div className="desk-stat"><div className="desk-stat-lbl">✔ FINISHED</div><div className="desk-stat-val" style={{color:"#5a9fd4"}}>{counts.Finished}</div></div>
            <div className="desk-stat"><div className="desk-stat-lbl">✕ EXIT</div><div className="desk-stat-val" style={{color:"#9b72cf"}}>{counts.Exit}</div></div>
            <div className="desk-stat"><div className="desk-stat-lbl">TOTAL QTY cm</div><div className="desk-stat-val" style={{color:"var(--text)",fontSize:18}}>{totalQty.toLocaleString()}</div></div>
          </div>
          <div className="desk-toolbar">
            <select className="lb-select" value={filter} onChange={e => setFilter(e.target.value)}>
              <option value="All">All Statuses</option>
              <option value="Approved">Approved</option>
              <option value="Under Manufacturing">Under Manufacturing</option>
              <option value="Finished">Finished</option>
              <option value="Exit">Exit</option>
            </select>
            <input className="lb-search" placeholder="🔍 Search by name, config, series, factory..." value={search} onChange={e => setSearch(e.target.value)} />
            <span style={{color:"var(--muted)",fontSize:11,fontFamily:"'JetBrains Mono',monospace",whiteSpace:"nowrap"}}>{filtered.length} results</span>
          </div>
          {filtered.length===0 ? (
            <div className="empty">No jobs found</div>
          ) : (
            <div className="tbl-wrap">
              <table className="tbl">
                <thead>
                  <tr>
                    <th>ID</th><th>Name</th><th>Status</th><th>Config</th>
                    <th>QTY</th><th>Factory</th><th>Amper</th><th>Series</th>
                    <th>IP</th><th>Date</th>
                    {(perms.canEditJob||perms.canDeleteJob) && <th>Actions</th>}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(job => (
                    <tr key={job.id}>
                      <td className="tbl-id">{job.id}</td>
                      <td className="tbl-name">{job.name}</td>
                      <td><SBadge status={job.status} /></td>
                      <td style={{fontSize:11}}>{job.config||"—"}</td>
                      <td>{job.qty||"—"}</td>
                      <td>{job.factory||"—"}</td>
                      <td>{job.ampere||"—"}</td>
                      <td>{job.series||"—"}</td>
                      <td>{job.ip||"—"}</td>
                      <td style={{fontSize:11}}>{job.date||"—"}</td>
                      {(perms.canEditJob||perms.canDeleteJob) && (
                        <td>
                          <div className="tbl-acts">
                            {perms.canEditJob && <button className="tbl-act" onClick={() => setModal(job)}>✎ Edit</button>}
                            {perms.canDeleteJob && <button className="tbl-act del" onClick={() => setConfirm({id:job.id})}>🗑</button>}
                          </div>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          {modal!==null && <JobModal job={modal?.id?modal:null} onSave={saveJob} onClose={() => setModal(null)} user={user} isDesktop={true} />}
          {confirm && <Confirm msg="هل أنت متأكد من حذف هذا الجوب؟" onOk={doDelete} onCancel={() => setConfirm(null)} />}
        </div>
      );
    }

    function DesktopUsersPage({ currentUser, toast, users, setUsers }) {
      const perms = PERMISSIONS[currentUser.role] || {};
      const [modal, setModal]   = useState(false);
      const [confirm, setConfirm] = useState(null);

      const addUser = async (f) => {
        try {
          const saved = await fbSaveUser(f);
          setUsers(p => [...p, saved]);
          setModal(false);
          toast("User created ✔");
        } catch(e) { toast("Error","error"); }
      };
      const toggle = async (uid) => {
        const u = users.find(x => x.uid===uid);
        try {
          await fbUpdateUser(uid, { active: !u.active });
          setUsers(p => p.map(x => x.uid===uid ? {...x,active:!x.active} : x));
          toast("Updated","info");
        } catch(e) { toast("Error","error"); }
      };
      const chRole = async (uid, role) => {
        try {
          await fbUpdateUser(uid, { role });
          setUsers(p => p.map(x => x.uid===uid ? {...x,role} : x));
          toast("Role changed","info");
        } catch(e) { toast("Error","error"); }
      };
      const doDelete = async () => {
        try {
          await fbDeleteUser(confirm.uid);
          setUsers(p => p.filter(x => x.uid!==confirm.uid));
          setConfirm(null);
          toast("Deleted","info");
        } catch(e) { toast("Error","error"); }
      };

      return (
        <div>
          <div className="desk-pg-title">
            <span>👥 USERS</span>
            {perms.canManageUsers && <button className="add-btn" onClick={() => setModal(true)}>+ New User</button>}
          </div>
          <div className="utbl-wrap">
            <table className="utbl">
              <thead>
                <tr>
                  <th>User</th><th>Email</th><th>Role</th><th>Status</th>
                  {perms.canManageUsers && <th>Actions</th>}
                </tr>
              </thead>
              <tbody>
                {users.map(u => (
                  <tr key={u.uid} style={{opacity:u.active?1:.45}}>
                    <td>
                      <div style={{display:"flex",alignItems:"center",gap:10}}>
                        <Av name={u.name} color={ROLES[u.role]?.color||"#888"} size={34} />
                        <span style={{fontWeight:700,fontSize:12}}>{u.name}</span>
                      </div>
                    </td>
                    <td style={{fontSize:11,color:"var(--muted)"}}>
                      {u.email}
                      {u.role==="factory"&&u.factory&&<span style={{color:"#9b72cf",marginRight:6}}> · F{u.factory}</span>}
                    </td>
                    <td>
                      {perms.canEditUserRole ? (
                        <select className="lb-select" style={{padding:"4px 8px",fontSize:11}}
                          value={u.role} onChange={e => chRole(u.uid,e.target.value)}>
                          {Object.entries(ROLES).map(([k,v]) => <option key={k} value={k}>{v.label}</option>)}
                        </select>
                      ) : (
                        <span className="badge" style={{background:(ROLES[u.role]?.color||"#888")+"22",color:ROLES[u.role]?.color||"#888"}}>
                          {ROLES[u.role]?.label||u.role}
                        </span>
                      )}
                    </td>
                    <td>
                      <span className="badge" style={u.active
                        ? {background:"rgba(42,157,143,.15)",color:"#2a9d8f"}
                        : {background:"rgba(107,114,128,.15)",color:"var(--muted)"}}>
                        {u.active?"✔ Active":"✕ Inactive"}
                      </span>
                    </td>
                    {perms.canManageUsers && (
                      <td>
                        <div className="tbl-acts">
                          <button className="tbl-act" style={u.active?{borderColor:"#2a9d8f",color:"#2a9d8f"}:{}} onClick={() => toggle(u.uid)}>
                            {u.active?"Deactivate":"Activate"}
                          </button>
                          {perms.canDeleteUser && u.uid!==currentUser.uid && (
                            <button className="tbl-act del" onClick={() => setConfirm({uid:u.uid,name:u.name})}>🗑</button>
                          )}
                        </div>
                      </td>
                    )}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {modal && <UserModal onSave={addUser} onClose={() => setModal(false)} isDesktop={true} />}
          {confirm && <Confirm msg={`حذف "${confirm.name}"؟`} onOk={doDelete} onCancel={() => setConfirm(null)} />}
        </div>
      );
    }

    function DesktopLayout({ user, onLogout, onToggleView, jobs, setJobs, users, setUsers, toast }) {
      const [page, setPage] = useState("jobs");
      const rc = ROLES[user.role]?.color || "#888";
      return (
        <div className="desk-wrap">
          <div className="tb">
            <span className="tb-logo">LECTRO BAR</span>
            <div className="tb-right">
              <ViewToggleBtn isDesktop={true} onToggle={onToggleView} />
              <Av name={user.name} color={rc} size={30} />
            </div>
          </div>
          <div className="desk-body">
            <div className="desk-main">
              {page==="jobs"  && <DesktopJobsPage  user={user} toast={toast} jobs={jobs} setJobs={setJobs} />}
              {page==="users" && <DesktopUsersPage currentUser={user} toast={toast} users={users} setUsers={setUsers} />}
            </div>
            <DesktopSidebar user={user} page={page} setPage={setPage} onLogout={onLogout} />
          </div>
        </div>
      );
    }

    /* ── LOGIN ─────────────────────────────────────────────────── */
    function LoginPage({ onLogin, users }) {
      const [email, setEmail] = useState("");
      const [pass,  setPass]  = useState("");
      const [err,   setErr]   = useState("");
      const [sel,   setSel]   = useState(null);
      const login = () => {
        const u = users.find(x => x.email===email);
        if (!u) return setErr("Invalid credentials");
        if (!u.active) return setErr("Account inactive");
        if (pass!==USER_PASSWORDS[email]) return setErr("Wrong password");
        onLogin(u);
      };
      const pickHint = (h) => { setEmail(h.email); setPass(""); setSel(h.email); setErr(""); };
      return (
        <div className="login-wrap">
          <div className="login-card">
            <div className="login-logo">LECTRO BAR</div>
            <div className="login-sub">Production Management System</div>
            {err && <div className="login-err">{err}</div>}
            <div className="lb-field">
              <label className="lb-label">Email</label>
              <input className="lb-input" type="email" placeholder="example@lectrobar.com"
                value={email} onChange={e => { setEmail(e.target.value); setErr(""); setSel(null); }}
                onKeyDown={e => e.key==="Enter" && login()} />
            </div>
            <div className="lb-field">
              <label className="lb-label">Password</label>
              <input className="lb-input" type="password" placeholder="••••••••"
                value={pass} onChange={e => { setPass(e.target.value); setErr(""); }}
                onKeyDown={e => e.key==="Enter" && login()} />
            </div>
            <button className="login-btn" onClick={login}>Login</button>
            <div className="hints-sep">
              <div className="hints-lbl">QUICK SELECT USER</div>
              <div className="hint-grid">
                {LOGIN_HINT.map(h => (
                  <button key={h.label} className={`hint-btn ${sel===h.email?"sel":""}`} onClick={() => pickHint(h)}>
                    {h.label}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ── APP ROOT ──────────────────────────────────────────────── */
    function App() {
      const [fbReady, setFbReady] = useState(!!window.__FB);
      const [loading, setLoading] = useState(true);
      const [user,    setUser]    = useState(null);
      const [jobs,    setJobs]    = useState([]);
      const [users,   setUsers]   = useState([]);
      const [toast, showToast]    = useToast();
      const [isDesktop, setIsDesktop] = useState(() => window.innerWidth >= 768);
      const [manualOverride, setManualOverride] = useState(false);

      // Wait for Firebase to load
      useEffect(() => {
        if (window.__FB) { setFbReady(true); return; }
        const handler = () => setFbReady(true);
        window.addEventListener("fb-ready", handler);
        return () => window.removeEventListener("fb-ready", handler);
      }, []);

      // Load data from Firestore once Firebase is ready
      useEffect(() => {
        if (!fbReady) return;
        async function load() {
          setLoading(true);
          try {
            await window.__FB.seedIfEmpty();
            const [j, u] = await Promise.all([fbGetJobs(), fbGetUsers()]);
            setJobs(j);
            setUsers(u);
          } catch(e) { console.error(e); }
          setLoading(false);
        }
        load();
      }, [fbReady]);

      useEffect(() => {
        if (manualOverride) return;
        const handler = () => setIsDesktop(window.innerWidth >= 768);
        window.addEventListener("resize", handler);
        return () => window.removeEventListener("resize", handler);
      }, [manualOverride]);

      const handleToggleView = () => { setIsDesktop(d => !d); setManualOverride(true); };
      const logout = () => setUser(null);

      if (!fbReady || loading) {
        return (
          <div className="loading-wrap">
            <div className="spinner"></div>
            <div className="loading-lbl">CONNECTING TO DATABASE...</div>
          </div>
        );
      }

      if (!user) return <LoginPage onLogin={u => setUser(u)} users={users} />;

      const sharedProps = { user, onLogout:logout, onToggleView:handleToggleView, jobs, setJobs, users, setUsers, toast:showToast };

      return (
        <>
          {isDesktop
            ? <DesktopLayout {...sharedProps} />
            : <MobileLayout  {...sharedProps} />
          }
          {toast && <div className={`toast ${toast.type}`}>{toast.msg}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
